[window]
dynamic_padding = true
decorations = "None"
opacity = 0.90
blur = true
title = " "
dynamic_title = false

[font]
normal = {family="FiraCode Nerd Font", style="Regular"}
size = 12

[scrolling]
history = 5000
multiplier = 4

[cursor]
blink_interval = 750
blink_timeout = 0
thickness = 0.15
unfocused_hollow = true

[cursor.style]
blinking = "On"
shape = "Beam"
