font_family FiraCode Nerd Font
font_size 12.0
bold_font auto
italic_font auto
bold_italic_font auto

emoji_font Noto Color Emoji

cursor_shape beam
cursor_blink_interval 0.75
cursor_stop_blinking_after 0
cursor_shape_unfocused hollow
cursor_trail 1

scrollback_lines 5000
wheel_scroll_multiplier 4

foreground #cdd6f4
background #1e1e2e
cursor #f5e0e6
cursor_text_color #1e1e2e
selection_foreground #1e1e2e
selection_background #f5e0e6

color0 #45475a
color1 #f38ba8
color2 #a6e3a1
color3 #f9e2af
color4 #89b4fa
color5 #f5c2e7
color6 #94e2d5
color7 #bac2de
color8 #585b70
color9 #f38ba8
color10 #a6e3a1
color11 #f9e2af
color12 #89b4fa
color13 #f5c2e7
color14 #94e2d5
color15 #cdd6f4

background_opacity 0.95
background_blur 1
dynamic_background_opacity 1
hide_window_decorations yes
window_title_template " "

shell /usr/bin/zsh

confirm_os_window_close 0
